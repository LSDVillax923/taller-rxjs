<div class="card mb-4 shadow-sm">
  <div class="card-body d-flex align-items-center gap-3">
    <img
      *ngIf="user.image"
      [src]="user.image"
      alt="Foto de {{ user.firstName }}"
      class="rounded-circle"
      width="72"
      height="72"
    />
    <div>
      <h3 class="mb-1">{{ user.firstName }} {{ user.lastName }}</h3>
      <p class="mb-1 text-muted">{{ '@' + user.username }}</p>
      <p class="mb-0"><i class="bi bi-envelope"></i> {{ user.email }}</p>
    </div>
  </div>
</div>
